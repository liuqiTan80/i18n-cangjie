# libdemo 人工润色示范（zhc 翻译众包平台种子 · 质量守则见 libs/README.md）
# 键 = 母语名（方言代码里写键，转译时替换为值）；值 = 官方原名，不得改动。
# 翻译守则：
#   · 只翻译有语义边界的类型/常量/函数名（如 颜色 = Color）；
#   · 通用短名保持恒等（x/y/h/w/sum 不译）——crates 映射是全局别名，
#     翻译 x → 横坐标 会把所有方言代码里同名的局部标识符一并改写；
#   · 词表冲突与重复键由 scripts/check-libs.py + zhc mapping check 把关。
["标识符"]
"颜色" = "Color"
"问候语" = "GREETING"
"数量上限" = "MAX_N"
"点" = "Point"
"点对" = "PointPair"
"矩形" = "Rect"
"图形" = "Shape"
"打招呼" = "greet"
"h" = "h"
"sum" = "sum"
"w" = "w"
"x" = "x"
"y" = "y"
