# ko 语言包 v0.1（演示级）：关键字映射（键 = 韩语方言词 → 值 = 官方仓颉关键字）。
# 键与 zh/ja 包官方值覆盖集对齐（59 键 / 57 官方值，跨语言一致性门禁；
# is 双别名：이다/속하다，public 双别名：공개/공용）。
# 节名仅作组织用途；除 [宏] 节独立（@ 后专用）外，其余节合并为关键字表。
# 类型词/逻辑值/常用内置在 stdlib.toml（走豁免集保护）。
# 翻译风格与术语表（全包统一，勿混用）：
#   · 汉字词名词为主（함수/클래스/구조체/변수），动词用하다系原形
#     （두다/낳다/던지다/잡다/돌려주다/나가다）——用 ZHCLANG=ko 编写 .kc 源码即韩文编程；
#   · 术语对照：변수=变量、상수=常量、속성=属性、열거형=枚举、동기=同步、추상=抽象。

["声明"]
"함수" = "func"
"메인" = "main"
"초기화" = "init"
"클래스" = "class"
"구조체" = "struct"
"인터페이스" = "interface"
"확장" = "extend"
"열거형" = "enum"
"두다" = "let"
"변수" = "var"
"상수" = "const"
"속성" = "prop"
"타입" = "type"
"매크로" = "macro"
"가져오기" = "import"
"패키지" = "package"
"공개" = "public"
"비공개" = "private"
"보호" = "protected"
"내부" = "internal"
"정적" = "static"
"추상" = "abstract"
"동기" = "synchronized"
"낳다" = "spawn"

["控制流"]
"만약" = "if"
"아니면" = "else"
"또는만약" = "else if"
"매치" = "match"
"경우" = "case"
"동안" = "while"
"각각" = "for"
"계속" = "continue"
"나가다" = "break"
"돌려주다" = "return"
"던지다" = "throw"
"시도" = "try"
"잡다" = "catch"
"마지막" = "finally"

["运算符"]
"이다" = "is"
"속하다" = "is"
"으로" = "as"
"연산자" = "operator"

# 扩展词表（教学阶段渐进引入）
["修饰"]
"변경" = "mut"
"개방" = "open"
"재정의" = "override"
"다시정의" = "redef"
"외부" = "foreign"
"위험" = "unsafe"
"공용" = "public"
"조건" = "where"
"이것" = "this"
"본타입" = "This"
"부모" = "super"

# prop 块内 get/set 是上下文词（非关键字），全局 token 替换 + 豁免集保护
["属性访问器"]
"얻기" = "get"
"설정" = "set"

["宏定义"]
"인용" = "quote"

# @ 前缀宏专用（独立宏映射表，@ 后只查本节）
["宏"]
"파생" = "Derive"
"시험" = "Test"
"기대" = "Expect"
