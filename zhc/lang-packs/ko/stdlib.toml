# ko 语言包 v0.1（演示级）：标准库路径 + 标识符别名（两遍扫描 + 豁免集保护）。
# 翻译风格同 keywords：动词/操作用하다系或名词化形（크기/정렬），型名用汉字词/外来语。
# 首版覆盖核心子集（表示/输入/类型/字符串与列表操作），完整度以 zhc lang list 为准。
# 术语表延续 keywords.toml 头注（全包统一，勿混用）。

["模块路径"]
"표준컬렉션" = "std.collection"
"표준핵심" = "std.core"
"수학" = "std.math"

["标识符"]
# 内置函数（非宏）
"출력" = "println"
"인쇄" = "print"
"읽어들이기" = "readln"
"확인" = "assert"
"같음확인" = "assertEqual"
"종료" = "exit"
"참" = "true"
"거짓" = "false"

# 常用类型（放别名表而非关键字表：走豁免集保护，用户可声明同名标识符）
"문자열" = "String"
"정수" = "Int64"
"실수" = "Float64"
"논리" = "Bool"
"배열" = "Array"
"목록" = "ArrayList"
"맵" = "HashMap"
"범위" = "Range"
"튜플" = "Tuple"
"옵션" = "Option"
"결과" = "Result"
"파일" = "File"
"경로" = "Path"

# 常用成员/方法（`.` 限定段照常替换，豁免集覆盖成员名）
"크기" = "size"
"비어있음" = "isEmpty"
"추가" = "add"
"포함" = "contains"
"제거" = "remove"
"문자화" = "toString"
"정렬" = "sort"
"나누기" = "split"
"붙이기" = "append"
"결합" = "join"
"변환" = "map"
"거르기" = "filter"
"순회" = "forEach"
"접기" = "fold"
"처음" = "first"
"끝" = "last"
"넣기" = "push"
"꺼내기" = "pop"
"쓰기" = "write"
"다읽기" = "readToEnd"
"읽기" = "read"
"줄읽기" = "readLine"
"닫기" = "close"
"비우기" = "flush"
"현재" = "now"
"찾기" = "indexOf"
"바꾸기" = "replace"
"시작함" = "startsWith"
"끝남" = "endsWith"
"다듬기" = "trimAscii"
"대문자" = "toAsciiUpper"
"소문자" = "toAsciiLower"
"모두" = "all"
"하나라도" = "any"
"최대" = "max"
"최소" = "min"
"내림" = "floor"
"올림" = "ceil"
"반올림" = "round"
"무작위값" = "random"
