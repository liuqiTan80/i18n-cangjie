# ko 语言包 v0.3（standard 档）：标准库路径 + 标识符别名（两遍扫描 + 豁免集保护）。
# 翻译风格同 keywords：动词/操作用하다系或名词化形（크기/정렬），型名用汉字词/外来语。
# zh 基线 203 官方值全量覆盖；where 由关键字层 조건 承载（豁免，见 docs/语言包开发.md）。
# 术语表延续 keywords.toml 头注（全包统一，勿混用）。

["模块路径"]
"표준컬렉션" = "std.collection"
"표준핵심" = "std.core"
"수학" = "std.math"

["标识符"]
