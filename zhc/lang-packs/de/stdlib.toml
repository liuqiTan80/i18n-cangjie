# de 语言包 v0.3（zh 基线完整，与 ja/ru 对齐）：标准库路径 + 标识符别名（两遍扫描 + 豁免集保护）。
# 翻译风格同 keywords：无变音符德语拼写（Zeige/Lege/Sortieren），型名名词化
# 首字母大写（Zeichenkette/Ganzzahl/Fliesskommazahl）。202 个官方值全覆盖
# （where 由关键字层 Wobei 承载，stdlib 不重复声明）；完整度以 zhc lang list 为准。
# 术语表延续 keywords.toml 头注（全包统一，勿混用）。

["模块路径"]
