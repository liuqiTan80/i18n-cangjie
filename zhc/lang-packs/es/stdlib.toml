# es 语言包 v0.3（zh 基线完整，与 ja/ru/de 对齐）：标准库路径 + 标识符别名（两遍扫描 + 豁免集保护）。
# 翻译风格同 keywords：无变音符西语拼写（mostrar/defina/ordenar），型名首字母大写
# （Cadena/Entero/Real）。202 个官方值全覆盖（where 由关键字层 donde 承载，
# stdlib 不重复声明）；完整度以 zhc lang list 为准。
# 术语表延续 keywords.toml 头注（全包统一，勿混用）。
["模块路径"]
"EstandarColecciones" = "std.collection"
"EstandarNucleo" = "std.core"
"Matematicas" = "std.math"

["标识符"]
