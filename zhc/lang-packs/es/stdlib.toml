# es 语言包 v0.1（演示级）：标准库路径 + 标识符别名（两遍扫描 + 豁免集保护）。
# 翻译风格同 keywords：无变音符西语拼写（mostrar/defina/ordenar），型名首字母大写
# （Cadena/Entero/Real）。首版覆盖核心子集（表示/输入/类型/字符串与列表操作），
# 完整度以 zhc lang list 为准。术语表延续 keywords.toml 头注（全包统一，勿混用）。

["模块路径"]
"EstandarColecciones" = "std.collection"
"EstandarNucleo" = "std.core"
"Matematicas" = "std.math"

["标识符"]
# 内置函数（非宏）
"mostrar" = "println"
"imprimir" = "print"
"leerLinea" = "readln"
"verificar" = "assert"
"verificarIgual" = "assertEqual"
"terminar" = "exit"
"verdadero" = "true"
"falso" = "false"

# 常用类型（放别名表而非关键字表：走豁免集保护，用户可声明同名标识符）
"Cadena" = "String"
"Entero" = "Int64"
"Real" = "Float64"
"Logico" = "Bool"
"Arreglo" = "Array"
"Lista" = "ArrayList"
"Mapa" = "HashMap"
"Rango" = "Range"
"Tupla" = "Tuple"
"Opcion" = "Option"
"Resultado" = "Result"
"Archivo" = "File"
"Ruta" = "Path"

# 常用成员/方法（`.` 限定段照常替换，豁免集覆盖成员名）
"tamano" = "size"
"estaVacio" = "isEmpty"
"agregar" = "add"
"contiene" = "contains"
"quitar" = "remove"
"aTexto" = "toString"
"ordenar" = "sort"
"dividir" = "split"
"adjuntar" = "append"
"unir" = "join"
"transformar" = "map"
"filtrar" = "filter"
"recorrer" = "forEach"
"plegar" = "fold"
"primero" = "first"
"ultimo" = "last"
"empujar" = "push"
"sacar" = "pop"
"escribir" = "write"
"leerTodo" = "readToEnd"
"leer" = "read"
"leerUnaLinea" = "readLine"
"cerrar" = "close"
"vaciar" = "flush"
"ahora" = "now"
"buscar" = "indexOf"
"reemplazar" = "replace"
"comienzaCon" = "startsWith"
"terminaCon" = "endsWith"
"recortar" = "trimAscii"
"aMayusculas" = "toAsciiUpper"
"aMinusculas" = "toAsciiLower"
"todos" = "all"
"alguno" = "any"
"maximo" = "max"
"minimo" = "min"
"piso" = "floor"
"techo" = "ceil"
"redondear" = "round"
"aleatorio" = "random"
