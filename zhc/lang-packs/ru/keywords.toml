# ru 语言包 v0.2：关键字映射（键 = 俄语方言词 → 值 = 官方仓颉关键字）。
# 与 zh 包条目数对齐（56 个官方值，跨语言一致性门禁）。
# 节名仅作组织用途；除 [宏] 节独立（@ 后专用）外，其余节合并为关键字表。
# 类型词/逻辑值/常用内置在 stdlib.toml（走豁免集保护）。

["声明"]
"функция" = "func"
"главная" = "main"
"инициализация" = "init"
"класс" = "class"
"структура" = "struct"
"интерфейс" = "interface"
"расширение" = "extend"
"перечисление" = "enum"
"пусть" = "let"
"переменная" = "var"
"константа" = "const"
"свойство" = "prop"
"тип" = "type"
"макрос" = "macro"
"импорт" = "import"
"пакет" = "package"
"публичный" = "public"
"приватный" = "private"
"защищённый" = "protected"
"внутренний" = "internal"
"статический" = "static"
"абстрактный" = "abstract"
"синхронизированный" = "synchronized"
"породить" = "spawn"

["控制流"]
"если" = "if"
"иначе" = "else"
"иначе если" = "else if"
"сопоставление" = "match"
"случай" = "case"
"пока" = "while"
"для" = "for"
"продолжить" = "continue"
"прервать" = "break"
"возврат" = "return"
"выбросить" = "throw"
"попытка" = "try"
"перехват" = "catch"
"наконец" = "finally"

["运算符"]
"является" = "is"
"как" = "as"
"принадлежит" = "is"

# 扩展词表（教学阶段渐进引入）
["修饰"]
"изменяемый" = "mut"
"открытый" = "open"
"переопределение" = "override"
"переопределить" = "redef"
"внешний" = "foreign"
"небезопасный" = "unsafe"
"общественный" = "public"
"где" = "where"
"это" = "this"
"Этот" = "This"
"супер" = "super"

# prop 块内 get/set 是上下文词（非关键字），全局 token 替换 + 豁免集保护
["属性访问器"]
"получить" = "get"
"установить" = "set"

["宏定义"]
"цитата" = "quote"

# @ 前缀宏专用（独立宏映射表，@ 后只查本节）
["宏"]
"Выводить" = "Derive"
"Тест" = "Test"
"Ожидать" = "Expect"
