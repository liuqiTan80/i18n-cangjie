# ar 语言包 v0.1.0（demo 试点）：标准库路径 + 标识符别名（两遍扫描 + 豁免集保护）。
# 翻译风格同 keywords：动词/操作用命令式（اعرض=println、اقرأ=readln、تأكد=assert），
# 类型词用名词（نص=String、عدد=Int64、منطقي=Bool）。
# demo 档为核心子集（14 键），示例/教程用词驱动补词直至 zh 基线 203 个官方值；
# 完整度以 zhc lang list 为准。

["模块路径"]
"مجموعات" = "std.collection"
"نواة" = "std.core"
"رياضيات" = "std.math"

["标识符"]
# 内置函数（非宏）
"اعرض" = "println"
"اطبع" = "print"
"اقرأ" = "readln"
"تأكد" = "assert"
"صحيح" = "true"
"خطأ" = "false"

# 常用类型（放别名表而非关键字表：走豁免集保护，用户可声明同名标识符）
"نص" = "String"
"عدد" = "Int64"
"منطقي" = "Bool"
"قائمة" = "ArrayList"
"قاموس" = "HashMap"
"مجموعة" = "HashSet"
"مصفوفة" = "Array"
"استثناء" = "Exception"
