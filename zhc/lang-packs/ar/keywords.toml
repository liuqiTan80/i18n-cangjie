# ar 语言包 v0.1.0（demo 试点，阶段 D 首个 RTL 包）：关键字映射（键 = 阿拉伯语方言词 → 值 = 官方仓颉关键字）。
# 键与 zh 包官方值覆盖集对齐（59 键 / 57 官方值，跨语言一致性门禁；
# is 双别名：هو/يتبع，public 双别名：عام/علني）。
# 节名仅作组织用途；除 [宏] 节独立（@ 后专用）外，其余节合并为关键字表。
# 类型词/逻辑值/常用内置在 stdlib.toml（走豁免集保护）。
# 书写规范（RTL 试点约定，全包统一）：
#   · 方言词一律不带变音符（tashkeel 省略是阿拉伯文排版常态，输入法友好；hamza
#     载体字母按正字保留，如 رئيسية/أنشئ/أرجع/أخيرا）；
#   · 键内不带空格（否则被词法切分为多个 token）；多词概念要么连写单串
#     （غيرآمن=unsafe），要么与 en/de 包同构使用带空格整串键（وإلا إذا=else if，
#     词法器按最长键串匹配，zhc run 实测通过）；
#   · 术语对照：دالة=func、دع=let、متغير=var、ثابت=const、صنف=class、
#     بنية=struct、إذا=if、وإلا=else、بينما=while、لكل=for、أرجع=return、
#     غير=mut（命令式"使其可变"）、غيرآمن=unsafe（غير 前缀=使其/使其非）、
#     تجاوز=override、إعادة=redef、أب=super、هذا=this、نوعي=This。

["声明"]
"دالة" = "func"
"رئيسية" = "main"
"تهيئة" = "init"
"صنف" = "class"
"بنية" = "struct"
"واجهة" = "interface"
"توسيع" = "extend"
"تعداد" = "enum"
"دع" = "let"
"متغير" = "var"
"ثابت" = "const"
"خاصية" = "prop"
"نوع" = "type"
"ماكرو" = "macro"
"استيراد" = "import"
"حزمة" = "package"
"عام" = "public"
"خاص" = "private"
"محمي" = "protected"
"داخلي" = "internal"
"ستاتيكي" = "static"
"تجريدي" = "abstract"
"متزامن" = "synchronized"
"أنشئ" = "spawn"

["控制流"]
"إذا" = "if"
"وإلا" = "else"
"وإلا إذا" = "else if"
"طابق" = "match"
"حالة" = "case"
"بينما" = "while"
"لكل" = "for"
"في" = "in"
"واصل" = "continue"
"اخرج" = "break"
"أرجع" = "return"
"ارم" = "throw"
"حاول" = "try"
"التقط" = "catch"
"أخيرا" = "finally"

["运算符"]
"هو" = "is"
"يتبع" = "is"
"مثل" = "as"
"عامل" = "operator"

# 扩展词表（教学阶段渐进引入）
["修饰"]
"غير" = "mut"
"مفتوح" = "open"
"تجاوز" = "override"
"إعادة" = "redef"
"خارجي" = "foreign"
"غيرآمن" = "unsafe"
"علني" = "public"
"حيث" = "where"
"هذا" = "this"
"نوعي" = "This"
"أب" = "super"

# prop 块内 get/set 是上下文词（非关键字），全局 token 替换 + 豁免集保护
["属性访问器"]
"احصل" = "get"
"ضع" = "set"

["宏定义"]
"اقتباس" = "quote"

# @ 前缀宏专用（独立宏映射表，@ 后只查本节）
["宏"]
"اشتقاق" = "Derive"
"اختبار" = "Test"
"توقع" = "Expect"
