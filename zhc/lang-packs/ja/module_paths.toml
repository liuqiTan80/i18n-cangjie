# ja 语言包 v0.2：import 语句态路径段映射（键 = 日语段 → 值 = 官方路径）
# 仅在 import 语句内生效（`いれる 標準コレクション.{...}` → `import std.collection.{...}`）；
# 表达式中的 `类型.关联函数` 不走此表，交给别名表（stdlib.toml）。
# 日文习惯：JSON/AST/IO 等外来语在日语中直接使用原词，故保留恒等。

["模块路径"]
"標準" = "std"
"標準コア" = "std.core"
"標準コレクション" = "std.collection"
"標準テスト" = "std.unittest"
"標準テストマクロ" = "std.unittest.testmacro"
"標準同期" = "std.sync"
"標準環境" = "std.env"
"標準変換" = "std.convert"
"標準ソート" = "std.sort"
"フォーマット" = "std.format"
"数学" = "std.math"
"ファイルシステム" = "std.fs"
"プロセス" = "std.os.process"
"正規表現" = "std.regex"
"時刻" = "std.time"
"JSON" = "std.json"
"AST" = "std.ast"
"IO" = "std.io"
"ランダム" = "std.random"
