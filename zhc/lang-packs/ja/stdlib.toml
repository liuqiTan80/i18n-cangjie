# ja 语言包 v0.2（演示级）：标准库路径 + 标识符别名（两遍扫描 + 豁免集保护）。
# 翻译风格同 keywords：假名为主（動詞/操作 = ひらがな），型名用日文汉字/片假名。
# 首版覆盖核心子集（表示/输入/类型/字符串与列表操作），完整度以 zhc lang list 为准。

["模块路径"]
"標準コレクション" = "std.collection"
"標準コア" = "std.core"
"数学" = "std.math"

["标识符"]
# 内置函数（非宏）
"ひょうじ" = "println"
"だす" = "print"
"よみこむ" = "readln"
"たしかめる" = "assert"
"くらべる" = "assertEqual"
"しゅうりょう" = "exit"
"真" = "true"
"偽" = "false"

# 常用类型（放别名表而非关键字表：走豁免集保护，用户可声明同名标识符）
"文字列" = "String"
"せいすう" = "Int64"
"じっすう" = "Float64"
"しんぎ" = "Bool"
"はいれつ" = "Array"
"リスト" = "ArrayList"
"マップ" = "HashMap"
"範囲" = "Range"
"タプル" = "Tuple"
"オプション" = "Option"
"結果" = "Result"
"ファイル" = "File"
"パス" = "Path"

# 常用成员/方法（`.` 限定段照常替换，豁免集覆盖成员名）
"ながさ" = "size"
"から" = "isEmpty"
"くわえる" = "add"
"ふくむ" = "contains"
"のぞく" = "remove"
"もじか" = "toString"
"ならべる" = "sort"
"わける" = "split"
"つなぐ" = "append"
"むすぶ" = "join"
"うつす" = "map"
"こす" = "filter"
"あるく" = "forEach"
"たたむ" = "fold"
"はじめ" = "first"
"おわり" = "last"
"おしこむ" = "push"
"とりだす" = "pop"
"かく" = "write"
"よみつくす" = "readToEnd"
"よみとる" = "read"
"よむ" = "readLine"
"とじる" = "close"
"はきだす" = "flush"
"いま" = "now"
"さがす" = "indexOf"
"おきかえる" = "replace"
"はじまる" = "startsWith"
"おわる" = "endsWith"
"けずる" = "trimAscii"
"おおもじ" = "toAsciiUpper"
"こもじ" = "toAsciiLower"
"ぜんぶ" = "all"
"どれか" = "any"
"さいだい" = "max"
"さいしょう" = "min"
"きりすて" = "floor"
"きりあげ" = "ceil"
"まるめる" = "round"
"でたらめ" = "random"
