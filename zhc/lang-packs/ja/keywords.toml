# ja 语言包 v0.2（演示级）：关键字映射（键 = 日语方言词 → 值 = 官方仓颉关键字）。
# 键与 zh 包条目数对齐（59 键 / 57 官方值，跨语言一致性门禁，is 双别名）。
# 节名仅作组织用途；除 [宏] 节独立（@ 后专用）外，其余节合并为关键字表。
# 类型词/逻辑值/常用内置在 stdlib.toml（走豁免集保护）。
# 翻译风格：假名（ひらがな）为主 + 少量日文汉字（関数/構造体）与片假名外来语
# （クラス/パッケージ/テスト）——用 ZHCLANG=ja 编写 .jc 源码即日文编程。

["声明"]
"関数" = "func"
"メイン" = "main"
"初期化" = "init"
"クラス" = "class"
"構造体" = "struct"
"インタフェース" = "interface"
"拡張" = "extend"
"列挙" = "enum"
"おく" = "let"
"変数" = "var"
"定数" = "const"
"プロパティ" = "prop"
"型" = "type"
"マクロ" = "macro"
"いれる" = "import"
"パッケージ" = "package"
"公開" = "public"
"非公開" = "private"
"保護" = "protected"
"うち" = "internal"
"静的" = "static"
"ちゅうしょう" = "abstract"
"同期" = "synchronized"
"うむ" = "spawn"

["控制流"]
"もし" = "if"
"でなければ" = "else"
"またもし" = "else if"
"マッチ" = "match"
"場合" = "case"
"あいだ" = "while"
"それぞれ" = "for"
"つづける" = "continue"
"ぬける" = "break"
"かえす" = "return"
"なげる" = "throw"
"ためす" = "try"
"とらえる" = "catch"
"さいご" = "finally"

["运算符"]
"は" = "is"
"である" = "is"
"として" = "as"
"演算子" = "operator"

# 扩展词表（教学阶段渐进引入）
["修饰"]
"可変" = "mut"
"開放" = "open"
"上書き" = "override"
"再定義" = "redef"
"よそ" = "foreign"
"あぶない" = "unsafe"
"おおやけ" = "public"
"ただし" = "where"
"これ" = "this"
"コレ" = "This"
"おや" = "super"

# prop 块内 get/set 是上下文词（非关键字），全局 token 替换 + 豁免集保护
["属性访问器"]
"取得" = "get"
"設定" = "set"

["宏定义"]
"クォート" = "quote"

# @ 前缀宏专用（独立宏映射表，@ 后只查本节）
["宏"]
"導出" = "Derive"
"テスト" = "Test"
"期待" = "Expect"
