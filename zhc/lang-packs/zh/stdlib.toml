# zh 语言包 v0.2：标准库路径 + 标识符别名（设计 §5.3、§6.2）
# 两节：["模块路径"]（import 语句态，后载覆盖 module_paths.toml 同名键）、
#       ["标识符"]（别名替换表：两遍扫描 + 豁免集保护，声明名/参数名/模式绑定不替换）
# 加载顺序即优先级：module_paths.toml → stdlib.toml，最后加载覆盖同名键（§6.3）。

["模块路径"]
"标准集合" = "std.collection"
"标准核心" = "std.core"
"数学" = "std.math"

["标识符"]
# 内置函数（非宏）
"打印" = "print"
"打印行" = "println"
"读取行" = "readln"
"断言" = "assert"
"断言相等" = "assertEqual"
"退出" = "exit"
"真" = "true"
"假" = "false"

# 常用类型（放别名表而非关键字表：走豁免集保护，用户可声明同名标识符）
