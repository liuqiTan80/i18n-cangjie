# errors.toml —— 诊断翻译（设计 §7.2，阶段 3 实测落地）
#
# 两类条目共存：
#   ① ["诊断码"]：键 = cjc JSON 的 DiagKind 字段（1.0.5 实测稳定，
#      如 sema_mismatched_types），作为错误码表第一优先级；
#   ② ["消息翻译"]：键 = 官方消息原文（精确 / 最长前缀 / ~ 后缀），兜底。
# 每条目字段：消息模板（{q0}/{q1} 占位符）、教学提示（💡）、
# 修复示例（§16.9 可粘贴修复代码块，母语关键字书写）。
# 匹配约束（坑 ②）：键不得含英文反向修正条目；母语匹配禁用 regex。

# ① 诊断码表（实测键）
["诊断码"]

["诊断码"."sema_mismatched_types"]
"消息模板" = "类型不匹配"
"教学提示" = "检查声明与赋值两侧类型是否一致。需要转换时使用 `作为`（as），仓颉不会自动做类型转换。"
"修复示例" = "可变 整数变量: 整数 = 1\n可变 文本变量: 字符串 = \"1\"\n// 声明与赋值两侧类型必须一致"

["诊断码"."chir_dce_unused_variable"]
"消息模板" = "变量 `{q0}` 从未被使用"
"教学提示" = "未使用的声明会被编译器警告。删除它，或确认是否拼写错误（比如把名字写成了别的变量）。"
"修复示例" = "可变 未使用的变量: 字符串 = \"hi\"\n// 方案一：删除该行\n// 方案二：使用它\n打印行(未使用的变量)"

["诊断码"."parse_expected_character"]
"消息模板" = "缺少 `{q0}`"
"教学提示" = "语法不完整：检查这一行的括号、分号或关键字是否漏写。每行语句以分号 `;` 或换行结尾。"
"修复示例" = "函数 甲() {\n    打印行(1)  // 语句以分号或换行结尾\n}"

["诊断码"."sema_cannot_assign_to_immutable"]
"消息模板" = "不能给不可变值赋值"
"教学提示" = "`让`（let）绑定一旦创建就不可修改。需要修改时把 `让` 改成 `可变`（var）。"
"修复示例" = "让 计数器: 整数 = 1\n// 修改值前，把 让 改为 可变：\n可变 计数器: 整数 = 1\n计数器 = 2"

["诊断码"."package_search_error"]
"消息模板" = "找不到包 `{q0}`"
"教学提示" = "导入的模块不存在。先确认标准库包名（如 `标准集合`/`数学`），再检查是否安装了对应用户库。"
"修复示例" = "导入 标准集合.{向量}\n导入 标准库.{打印行}\n// 确认导入的路径在标准库或已安装的库中"

["诊断码"."sema_undeclared_identifier"]
"消息模板" = "未声明的标识符 `{q0}`"
"教学提示" = "使用了未定义的名称：检查拼写；变量需先声明后使用；块作用域（`{}`）内声明的名字仅块内可见。"
"修复示例" = "函数 主() {\n    可变 总数: 整数 = 1\n    打印行(总数)  // 先声明，再使用\n}"

["诊断码"."sema_undeclared_type_name"]
"消息模板" = "未声明的类型名 `{q0}`"
"教学提示" = "类型必须已声明或已导入：检查类型名拼写；自建类型需先定义；标准库类型需导入对应模块（如 `标准集合`）。"
"修复示例" = "导入 标准集合.{向量}\n类 我的类型 {}\n函数 甲() {\n    让 变量: 我的类型 = 我的类型()\n    让 列表: 向量<整数> = 向量<整数>()\n}"

["诊断码"."sema_redefinition"]
"消息模板" = "重复声明 `{q0}`"
"教学提示" = "同一作用域内名字只能声明一次：检查是否有重复定义，或与导入的标识符冲突（改名或去掉多余声明）。"
"修复示例" = "让 变量 = 1\n// 让 变量 = 2  // 重复声明报错，改名：\n可变 变量2 = 2"

["诊断码"."sema_generic_type_without_type_argument"]
"消息模板" = "泛型类型缺少类型参数"
"教学提示" = "泛型类型（如 `向量`/`哈希映射`/`选项`）使用时必须给出类型参数：`向量<整数>`、`选项<字符串>`。"
"修复示例" = "让 列表: 向量<整数> = 向量<整数>()\n让 可能值: 选项<字符串> = 无值"

["诊断码"."sema_exceed_num_value_range"]
"消息模板" = "数字 `{q0}` 超出类型 `{q1}` 的取值范围"
"教学提示" = "字面量数值超出目标类型的取值范围：改用更大的类型（如 `整数` 超出时用 `无符号整数`），或改为运行时计算。"
"修复示例" = "让 大数: 无符号整数 = 9223372036854775808"

["诊断码"."parse_expected_right_delimiter"]
"消息模板" = "未闭合的分隔符 `{q0}`"
"教学提示" = "括号/方括号/花括号必须成对闭合：检查嵌套与缩进，每打开一个 `(`/`[`/`{` 都要有对应的 `)`/`]`/`}`。"
"修复示例" = "函数 甲() {\n    打印行(1)\n}  // 括号成对"

["诊断码"."lex_unrecognized_escape"]
"消息模板" = "无法识别的转义 `{q0}`"
"教学提示" = "字符串转义序列不支持 `\\q`：仓颉支持 `\\n`（换行）、`\\t`（制表）、`\\\\`、`\\\"`、`\\uXXXX`（Unicode）等。"
"修复示例" = "打印行(\"第一行\\n第二行\")  // 换行用 \\n"

["诊断码"."sema_missing_entry"]
"消息模板" = "缺少程序入口 `{q0}`"
"教学提示" = "可执行程序必须提供入口 `主函数()`：每个工程有且只有一个 `主函数()`，参数与返回类型保持默认。"
"修复示例" = "主函数() {\n    打印行(\"你好，仓颉！\")\n}"

["诊断码"."sema_wrong_number_of_arguments"]
"消息模板" = "调用参数数量不匹配：`{q0}`"
"教学提示" = "实参个数必须与形参个数一致：数一数调用处的参数，缺失或多余都会报错。"
"修复示例" = "函数 甲(参数: 整数) {}\n甲(1)  // 实参 1 个，形参 1 个，匹配"

# ② 消息表（兜底；键为官方消息原文，精确 → 最长前缀 → ~ 后缀）
["消息翻译"]

