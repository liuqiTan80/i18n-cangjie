["消息翻译"."~ is immutable"]
"消息模板" = "变量 `{q0}` 是不可变绑定"
"教学提示" = "`让`（let）绑定不可修改，需要修改时改为 `可变`（var）。"

# 未使用（消息形态漂移兜底）
["消息翻译"."~ is never used"]
