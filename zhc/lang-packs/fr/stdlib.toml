# fr 语言包 v0.1（演示级）：标准库路径 + 标识符别名（两遍扫描 + 豁免集保护）。
# 翻译风格同 keywords：无变音符法语拼写（afficher/lire/trier），型名首字母大写
# （Chaine/Entier/Reel）。首版覆盖核心子集（表示/输入/类型/字符串与列表操作），
# 完整度以 zhc lang list 为准。术语表延续 keywords.toml 头注（全包统一，勿混用）。

["模块路径"]
"StandardCollections" = "std.collection"
"StandardNoyau" = "std.core"
"Mathematiques" = "std.math"

["标识符"]
# 内置函数（非宏）
"afficher" = "println"
"imprimer" = "print"
"lireLigne" = "readln"
"verifier" = "assert"
"verifierEgalite" = "assertEqual"
"quitter" = "exit"
"vrai" = "true"
"faux" = "false"

# 常用类型（放别名表而非关键字表：走豁免集保护，用户可声明同名标识符）
"Chaine" = "String"
"Entier" = "Int64"
"Reel" = "Float64"
"Booleen" = "Bool"
"Tableau" = "Array"
"Liste" = "ArrayList"
"Carte" = "HashMap"
"Plage" = "Range"
"Tuple" = "Tuple"
"Option" = "Option"
"Resultat" = "Result"
"Fichier" = "File"
"Chemin" = "Path"

# 常用成员/方法（`.` 限定段照常替换，豁免集覆盖成员名）
"taille" = "size"
"estVide" = "isEmpty"
"ajouter" = "add"
"contient" = "contains"
"retirer" = "remove"
"enChaine" = "toString"
"trier" = "sort"
"diviser" = "split"
"attacher" = "append"
"joindre" = "join"
"transformer" = "map"
"filtrer" = "filter"
"parcourir" = "forEach"
"reduire" = "fold"
"premier" = "first"
"dernier" = "last"
"empiler" = "push"
"depiler" = "pop"
"ecrire" = "write"
"lireTout" = "readToEnd"
"lire" = "read"
"lireUneLigne" = "readLine"
"fermer" = "close"
"vider" = "flush"
"maintenant" = "now"
"chercher" = "indexOf"
"remplacer" = "replace"
"commencePar" = "startsWith"
"finitPar" = "endsWith"
"couper" = "trimAscii"
"enMajuscules" = "toAsciiUpper"
"enMinuscules" = "toAsciiLower"
"tous" = "all"
"quelque" = "any"
"maximum" = "max"
"minimum" = "min"
"plancher" = "floor"
"plafond" = "ceil"
"arrondir" = "round"
"aleatoire" = "random"
