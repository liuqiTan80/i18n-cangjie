# fr 语言包 v0.3（zh 基线完整，与 ja/ru/de/es 对齐）：标准库路径 + 标识符别名（两遍扫描 + 豁免集保护）。
# 翻译风格同 keywords：无变音符法语拼写（soit/ecrire/affichable），型名首字母大写
# （Chaine/Entier/Tableau）。202 个官方值全覆盖（where 由关键字层 sachant 承载，
# stdlib 不重复声明）；完整度以 zhc lang list 为准。
# 术语表延续 keywords.toml 头注（全包统一，勿混用）。

["模块路径"]
